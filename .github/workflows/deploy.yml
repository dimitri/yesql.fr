name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "${{ env.HUGO_VERSION }}"
          extended: true

      # The fr/en parity guard in layouts/partials/assert-parity.html raises
      # errorf on drift, so a mismatched price fails right here.
      - name: Build
        run: hugo --minify --gc --baseURL "https://yesql.fr/"

      - name: Fail on template warnings
        run: |
          hugo --renderToMemory --logLevel warn --printPathWarnings 2>&1 | tee /tmp/hugo.log
          ! grep -q '^WARN' /tmp/hugo.log

      - uses: lycheeverse/lychee-action@v2
        with:
          args: "--offline --no-progress --root-dir docs docs/"
          fail: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: "${{ steps.deployment.outputs.page_url }}"
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
