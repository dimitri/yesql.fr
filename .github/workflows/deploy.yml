name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Keep in step with the local toolchain: hugo version.
  HUGO_VERSION: "0.164.0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Hugo (extended)
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # The fr/en parity guard in layouts/partials/assert-parity.html calls
      # errorf on drift, so a price changed in one language only fails here.
      - name: Build
        run: hugo --minify --gc --baseURL "https://yesql.fr/"

      # Template lookup failures and broken content references are warnings,
      # not errors, so they would otherwise ship silently.
      - name: Fail on any Hugo warning
        run: |
          hugo --renderToMemory --logLevel warn --printPathWarnings 2>&1 | tee /tmp/hugo.log
          if grep -q '^WARN' /tmp/hugo.log; then
            echo "::error::Hugo emitted warnings, see the log above"
            exit 1
          fi

      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir docs docs/
          fail: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
