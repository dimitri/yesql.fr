{{- /* CTA 2 of 3 — user club. The low-friction one: email only, nothing else,
       no qualifying question. Kept in its own block, never adjacent to the
       quote form. */ -}}
{{- $kit := site.Params.kit -}}
<div class="form-block form-club" id="form-club">
  <div class="wrap wrap-narrow">
    <h2 class="form-title">{{ .Params.cta.label }}</h2>
    <p class="form-note">{{ .Params.cta.note }}</p>
    <form class="form form-inline" method="post" action="{{ $kit.base }}/{{ $kit.club }}/subscriptions">
      <p class="field">
        <label for="club-email">{{ i18n "form_email" }}</label>
        <input id="club-email" type="email" name="email_address" required
               autocomplete="email" placeholder="{{ i18n "form_email_ph" }}">
      </p>
      <p class="field field-submit">
        <button class="btn btn-club" type="submit">{{ .Params.cta.label }}</button>
      </p>
    </form>
    <p class="form-privacy">{{ i18n "form_privacy" }}</p>
  </div>
</div>
