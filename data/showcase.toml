# Portfolio cards for the homepage. URLs, repos and tech labels are
# language-neutral and live here; the human-readable blurbs are translated in
# content/<lang>/sections/{showcase,writing}.md under [blurbs], keyed by `id`.
#
# `kind` groups items into the two homepage sections via each content file's
# `showcase_kinds` front-matter filter: "oss" -> the OSS portfolio section,
# "book"/"writing" -> the writing & teaching section.

