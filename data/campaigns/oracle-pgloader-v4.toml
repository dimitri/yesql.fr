backers    = 1             # just the seed; the count that matters starts now

opened     = "2026-01-15"
# No deadline: not actively promoted yet, and a stale/passed date reads
# worse than none. Add one back when this is ready for a real push.
updated    = "2026-09-03"

project    = "pgloader"
repo       = "https://github.com/dimitri/pgloader"
license    = "PostgreSQL License"
