# Fund-a-feature campaign figures — LANGUAGE-NEUTRAL, single source of truth.
# The prose lives in content/<lang>/campaigns/oracle-pgloader-v4/index.md,
# which points here with `campaign = "oracle-pgloader-v4"`.
#
# Update `raised`, `backers` and `updated` here and both language versions of
# the site move together. No number is ever duplicated.

status     = "open"        # open | funded | closed
currency   = "EUR"

target     = 50000         # full scope
threshold  = 30000         # below this, development does not start
raised     = 7500          # seed money: the maintainer's own investment so far
backers    = 1             # just the seed; the count that matters starts now

opened     = "2026-01-15"
deadline   = "2026-06-30"
updated    = "2026-09-03"

project    = "pgloader"
repo       = "https://github.com/dimitri/pgloader"
license    = "PostgreSQL License"
pledge_url = "https://sales.theartofpostgresql.com/yesql-oss-campaign/"

# Amounts only. The labels are translated, in the content file's [tier_labels].
[[tiers]]
  id     = "individual"
  amount = 250
[[tiers]]
  id     = "company"
  amount = 5000
[[tiers]]
  id     = "sponsor"
  amount = 15000
