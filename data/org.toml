# Language-neutral company identity. Feeds the schema.org Organization node,
# the footer and both legal notices. Nothing here is translated.
#
# Source: the official INSEE-backed registry
# https://annuaire-entreprises.data.gouv.fr/entreprise/838806933
# Verified 2026-09-02.

legalName    = "YeSQL"
registryName = "YESQL"                  # exactly as registered at the RCS
founder      = "Dimitri Fontaine"
role         = "Président"
email        = "contact@yesql.fr"
logo         = "/img/yesql-mark.svg"

# Registration
legalForm    = "Société par actions simplifiée (SAS)"
capital      = 5000
capitalCurrency = "EUR"
siren        = "838 806 933"
siret        = "838 806 933 00019"       # siège
vatID        = "FR57838806933"
rcs          = "RCS Paris 838 806 933"
ape          = "6201Z"
apeLabel     = "Programmation informatique"
foundingDate = "2018-04-09"

# First PostgreSQL database in production — drives the "25+ years" claim.
pgSince = 1999

# Other properties, all the same person — the single source for both the
# visible "Elsewhere" list on /about/ and the schema.org sameAs property
# (built from this same array in head/ld-json.html, so the two can never
# drift apart). Labels and blurbs are translated in content/<lang>/about.md's
# [elsewhere_labels], keyed by this id.
[[elsewhere]]
  id  = "pgloader"
  url = "https://pgloader.io/"
[[elsewhere]]
  id  = "book"
  url = "https://theartofpostgresql.com/"
[[elsewhere]]
  id  = "blog"
  url = "https://tapoueh.org/"
[[elsewhere]]
  id  = "github"
  url = "https://github.com/dimitri"

[address]
  streetAddress   = "209 rue Saint-Honoré"
  postalCode      = "75001"
  addressLocality = "Paris"
  addressCountry  = "FR"
