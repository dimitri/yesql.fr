# Language-neutral company identity. Feeds the schema.org Organization node,
# the footer and both legal notices. Nothing here is translated.
#
# Source: the official INSEE-backed registry
# https://annuaire-entreprises.data.gouv.fr/entreprise/838806933
# Verified 2026-09-02.

legalName    = "YeSQL"
registryName = "YESQL"                  # exactly as registered at the RCS
founder      = "Dimitri Fontaine"
role         = "Président"
email        = "contact@yesql.fr"
logo         = "/img/yesql-mark.svg"

# Registration
legalForm    = "Société par actions simplifiée (SAS)"
capital      = 5000
capitalCurrency = "EUR"
siren        = "838 806 933"
siret        = "838 806 933 00019"       # siège
vatID        = "FR57838806933"
rcs          = "RCS Paris 838 806 933"
ape          = "6201Z"
apeLabel     = "Programmation informatique"
foundingDate = "2018-04-09"

# First PostgreSQL database in production — drives the "25+ years" claim.
pgSince = 1999

# Other properties, all the same person — the single source for the visible
# "Elsewhere" list on /about/, grouped there by `category`. Labels, blurbs
# and category headings are translated in content/<lang>/about.md's
# [elsewhere_labels] / [elsewhere_categories], keyed by `id` / `category`.
#
# `sameAs = true` marks entries also fed into the schema.org sameAs property
# (built from this same array in head/ld-json.html, so the two lists can
# never drift apart) — kept to entity-level pages (the person's own
# properties), not individual repos, which are works rather than profiles.
[[elsewhere]]
  category = "writing"
  id       = "blog"
  url      = "https://tapoueh.org/"
  sameAs   = true
[[elsewhere]]
